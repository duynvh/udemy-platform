# Local infrastructure for the course marketplace (spec/SPEC-platform.md, "Local container engine").
# Run from the repository root:  podman compose -f infra/compose.yaml up -d
# Values come from infra/.env (copy infra/.env.example). Compose stops with an error if a value is missing.
#
# Rules for every service:
# - Fully qualified image name with a pinned tag (Podman can ask which registry to use for a short name).
# - Ports bind to 127.0.0.1 only: the services are not reachable from the local network.
# - A healthcheck, so "podman compose ps" shows "healthy" and later services can wait for it.

name: marketplace

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in infra/.env}
      POSTGRES_DB: marketplace
      # Read by postgres/init-schemas.sql to create the application role.
      MARKETPLACE_DB_USER: ${MARKETPLACE_DB_USER:?set MARKETPLACE_DB_USER in infra/.env}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set MARKETPLACE_DB_PASSWORD in infra/.env}
      # Read by postgres/init-keycloak.sql to create the Keycloak role and database.
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images store data in a versioned sub-folder; mount the parent folder.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/10-init-schemas.sql:ro
      - ./postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/20-init-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: docker.io/valkey/valkey:8.1.12-alpine
    # First argument "valkey-server" lets the image entrypoint drop root and run as user "valkey".
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in infra/.env}", "--appendonly", "yes"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: docker.io/apache/kafka:4.1.1
    environment:
      # Single node in KRaft mode: one process is broker and controller.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092). EXTERNAL: the host (localhost:9092). Both need a password.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # Users: "broker" (inter-broker traffic) and "marketplace" (applications).
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD:?set KAFKA_BROKER_PASSWORD in infra/.env}"
        user_broker="${KAFKA_BROKER_PASSWORD}" user_marketplace="${KAFKA_APP_PASSWORD:?set KAFKA_APP_PASSWORD in infra/.env}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_broker="${KAFKA_BROKER_PASSWORD}" user_marketplace="${KAFKA_APP_PASSWORD}";
      # Topics are created on purpose by the modules, never by a typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # A TCP check is enough here; a Kafka CLI check starts a second JVM every few seconds.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/29092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  opensearch:
    image: docker.io/opensearchproject/opensearch:3.10.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # The security plugin stays on: HTTPS with demo certificates and user "admin".
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set OPENSEARCH_ADMIN_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" \"https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in infra/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in infra/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:v1.34.0
    # The image runs as root by default; Mailpit needs no root (ports above 1024, in-memory store).
    user: "65534:65534"
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Dev mode: HTTP and no build step. --import-realm creates the realm only if it does not exist yet.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Fixed public URL: tokens always carry issuer http://localhost:8180/realms/marketplace.
      # Containers reach Keycloak at http://keycloak:8080 (back channel) with the same issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
      # Placeholders in keycloak/marketplace-realm.json; no secret is stored in Git.
      MARKETPLACE_BFF_CLIENT_SECRET: ${MARKETPLACE_BFF_CLIENT_SECRET:?set MARKETPLACE_BFF_CLIENT_SECRET in infra/.env}
      MARKETPLACE_TEST_STUDENT_PASSWORD: ${MARKETPLACE_TEST_STUDENT_PASSWORD:?set MARKETPLACE_TEST_STUDENT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/marketplace-realm.json:/opt/keycloak/data/import/marketplace-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; send a raw HTTP request to the management port (9000, inside the container only).
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
  opensearch-data:
  rustfs-data:

spring:
  application:
    name: marketplace-api
  profiles:
    # "local" connects to the Podman Compose stack (application-local.yml). Tests activate "test" instead.
    default: local
  threads:
    virtual:
      # I/O-bound calls (database, Stripe, RustFS, OpenSearch) scale without reactive code.
      enabled: true
  jpa:
    # No lazy loading during view rendering: each use case loads what it needs inside its transaction.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    # History table in its own schema; every migration names its target schema explicitly.
    default-schema: flyway
    create-schemas: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema: shared
        # The table comes from Flyway (db/migration/shared/V1__event_publication.sql).
        schema-initialization:
          enabled: false

server:
  port: ${SERVER_PORT:8090}

management:
  server:
    # Actuator on its own port: the BFF and ingress never expose it (SPEC-platform, Security baseline).
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # Histogram buckets let Prometheus compute p95 latency (SLO: search p95 < 500 ms, architecture §11.3).
        http.server.requests: true
    tags:
      # Every series names its service, so dashboards can filter one service.
      application: ${spring.application.name}
